name: Verify Receipt

on:
  push:
    branches: [master]
    paths: ['app/**', 'web/**', 'tests/**', 'scripts/**', 'requirements*.txt', '.github/workflows/**']
  pull_request:
    paths: ['app/**', 'web/**', 'tests/**', 'scripts/**', 'requirements*.txt', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      check_deployment:
        description: Exercise the hosted app with constructed inputs and real Qloo calls
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install public source dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependencies and offline regression tests
        run: |
          python -m pip check
          python -m pytest -q
      - name: Check public deployment from a separate network
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_deployment }}
        run: python scripts/check_deployment.py --base-url https://receipt.91.99.162.43.sslip.io
